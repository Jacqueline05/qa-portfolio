name: Portfolio validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Postman collection JSON
        run: python -c "import json; json.load(open('postman/ShopEasy.postman_collection.json', encoding='utf-8')); print('Postman collection is valid JSON')"

      - name: Validate Python automation syntax
        run: python -m py_compile automation-scripts/checkout_test.py

      - name: Check required portfolio folders
        run: |
          test -d test-cases
          test -d bug-reports
          test -d api-testing
          test -d automation-scripts
          test -f README.md
